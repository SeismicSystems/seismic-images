# The /run/seismic namespace: tmpfs state that must outlive the unit that
# wrote it, nearly all of it handed from one service to another. Each line's
# owner and mode ARE its ACL, kept in one file so they can be audited side by
# side; the group names must stay in lockstep with the users/groups created
# in mkosi.postinst. Private state sits under its owner's dir with an
# owner-only mode, as summit's keys do. State that lives and dies with one
# unit belongs to that unit instead, via RuntimeDirectory= (e.g. reth's
# engine-socket dir /run/reth-engine).
#
# Materialized by systemd-tmpfiles-setup.service at sysinit.target on
# every boot — tmpfs, so everything starts empty each boot, and reachable
# before /persistent is mounted.

d /run/seismic                0755  root       root           -
# Custodian IPC namespace: the custodian's socket plus its LUKS-keyfile
# drop-zone. setgid makes the socket inherit custodian-ipc for authorized
# local clients (the keyfile itself is 0400, readable only by root's
# persistent-luks-setup).
d /run/seismic/custodian      2750  custodian  custodian-ipc  -
# tdx-init's config drop-zone — everything the operator POST fans out to:
# domain.env, custodian.env, attestation.env, network-manifest.json,
# reth-genesis.json, summit-genesis.toml. setgid so the files tdx-init
# writes inherit group=conf; attestation/reth/summit read via their `conf`
# supplementary group (set in mkosi.postinst). Mirrors the /persistent/conf
# semantics from tmpfiles-persistent.conf.
d /run/seismic/conf           2750  tdx-init   conf           -
# LUKS-wipe progress drop-zone: persistent-luks-setup (runs as root) writes
# luks.json here during the long first-boot wipe, and the attestation service
# serves it via getLuksProvisioningStatus for the operator CLI's progress bar.
# Only root writes; the attestation service reads the world-readable (0644)
# file as the `attestation` user, so a plain root-owned dir suffices.
d /run/seismic/status         0755  root       root           -
# What summit's setup units (both User=summit) produce. public-keys.json is
# world-readable, since the keys are public, and the attestation service
# serves it on its harvest port. Only summit writes, and summit.service itself
# gets the dir read-only.
d /run/seismic/summit         0755  summit     summit         -
# Summit's private keys, from summit-keygen at boot until summit-persist
# copies them into /persistent/summit/keys, and for the rest of the boot
# after that. Only summit can enter, and summit.service not at all. Not a
# RuntimeDirectory= of summit-keygen: systemd removes those when the unit
# stops, and a restart of summit.target stops it, which would lose the keys
# the manifest pins.
d /run/seismic/summit/keys    0700  summit     summit         -
