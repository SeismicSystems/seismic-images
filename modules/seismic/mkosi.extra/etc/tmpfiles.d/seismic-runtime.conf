# Runtime drop-zone for tdx-init's per-service env files (custodian.env,
# attestation.env, domain.env). On tmpfs so it's reachable before
# /persistent is mounted.
# Materialized by systemd-tmpfiles-setup.service at sysinit.target on every boot.
#
# Mode 2750: setgid so files tdx-init writes inherit group=conf;
# attestation/reth/summit read via their `conf` supplementary group
# (set in mkosi.postinst). Mirrors the /persistent/conf semantics from
# tmpfiles-persistent.conf.

d /run/seismic                0755  root       root           -
# Custodian IPC namespace: the custodian's socket plus its LUKS-keyfile
# drop-zone. setgid makes the socket inherit custodian-ipc for authorized
# local clients (the keyfile itself is 0400, readable only by root's
# setup-persistent-luks).
d /run/seismic/custodian      2750  custodian  custodian-ipc  -
d /run/seismic/conf           2750  tdx-init   conf           -
# LUKS-wipe progress drop-zone: setup-persistent-luks (runs as root) writes
# luks.json here during the long first-boot wipe, and the attestation service
# serves it via getLuksProvisioningStatus for the operator CLI's progress bar.
# Only root writes; the attestation service reads the world-readable (0644)
# file as the `attestation` user, so a plain root-owned dir suffices.
d /run/seismic/status         0755  root       root           -
