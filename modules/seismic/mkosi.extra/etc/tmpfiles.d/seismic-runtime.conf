# Runtime drop-zone for tdx-init's per-service env files (enclave.env,
# domain.env). On tmpfs so it's reachable before /persistent is mounted.
# Materialized by systemd-tmpfiles-setup.service at sysinit.target on every boot.
#
# Mode 2750: setgid so files tdx-init writes inherit group=conf;
# enclave/reth/summit read via their `conf` supplementary group
# (set in mkosi.postinst). Mirrors the /persistent/conf semantics from
# tmpfiles-persistent.conf.

d /run/seismic                0755  root      root           -
# Custodian IPC namespace. setgid makes the socket inherit custodian-ipc for
# authorized local clients.
d /run/seismic/custodian      2750  enclave   custodian-ipc  -
d /run/seismic/conf           2750  tdx-init  conf           -
# LUKS-wipe progress drop-zone: setup-persistent-luks (runs as root) writes
# luks.json here during the long first-boot wipe, and enclave-server serves it
# via getLuksProvisioningStatus for the operator CLI's progress bar. Only root
# writes; enclave-server reads the world-readable (0644) file as the `enclave`
# user, so a plain root-owned dir suffices.
d /run/seismic/status         0755  root      root     -
