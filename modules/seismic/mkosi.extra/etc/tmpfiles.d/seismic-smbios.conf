# Let the attestation service (User=attestation, in the tpm group) read the
# SMBIOS memory devices (type 17). It sums their sizes into the ram_bytes of
# its platform metadata, on both GCP and Azure:
# https://github.com/easy-tee/attest/blob/12f1e29f6ea63ecc2f80f39c2c1f1172720bcf24/crates/measure/src/platform.rs#L75-L96
#
# The kernel creates these entries root 0400. Only type 17 is opened up: the
# other entries hold serial numbers and UUIDs that nothing reads.
z /sys/firmware/dmi/entries/17-*/raw 0440 root tpm -
