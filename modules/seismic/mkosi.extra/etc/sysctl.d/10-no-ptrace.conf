# No process, root included, may ptrace another, read its /proc/<pid>/mem or
# call process_vm_readv on it, until the next boot. Nothing on the node
# debugs another process. Needs CONFIG_SECURITY_YAMA. The devtools profile
# overrides it to 1 (20-devtools-ptrace.conf) so strace works on dev images.
#
# Yama's levels, each narrowing who may attach:
#   0  any process of the same UID (plain Linux)
#   1  only an ancestor, or a process the target names with PR_SET_PTRACER
#   2  only CAP_SYS_PTRACE, i.e. root
#   3  nobody, and the setting can't be lowered until reboot
# Root can still attach at 1 and 2. Only 3 stops it, and root can't lower 3.
# https://www.kernel.org/doc/html/latest/admin-guide/LSM/Yama.html
kernel.yama.ptrace_scope = 3
