# Source-of-truth ownership/mode for the per-service /persistent subdirs.
# Applied by persistent-luks-setup.service's ExecStartPost after the LUKS
# volume is mounted at /persistent. Not in /etc/tmpfiles.d/ on purpose:
# systemd-tmpfiles-setup.service runs at sysinit.target, well before
# persistent-luks-setup mounts /persistent, so the standard-path lookup
# would either error on the missing parent or — worse — create the dirs
# on the rootfs and have them shadowed once the LUKS volume mounts on top.
#
# Owners match the system users created in mkosi.postinst.

# The node's nginx site config and certbot state (account, certificate, TLS
# key). Root-only: nginx-ssl-setup and certbot-renew write it, nginx reads it.
d /persistent/nginx           0700  root      root     -


d /persistent/reth            0700  reth      reth     -

d /persistent/summit          0700  summit    summit   -
# summit's CLI doesn't auto-create its db/ path and expects it to exist.
# keys/ is written by summit-persist.service.
# TODO: we should probably mimic reth and have summit create and manage its
# subdirs itself like reth does: `seismic-reth --datadir /persistent/reth`
# creates everything it needs underneath at runtime.
d /persistent/summit/db       0700  summit    summit   -
d /persistent/summit/keys     0700  summit    summit   -
