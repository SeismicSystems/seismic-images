# The attestation service's root-key admission trusts whatever answers on
# 127.0.0.1:8545, so only reth may bind it, including while reth is down.
# Every unit lands in system.slice unless it names another slice, as
# reth.service does, and no unit can lift its slice's deny. The production
# image starts no login path, so no process runs in user.slice.
# Needs CONFIG_CGROUP_BPF=y: without it systemd logs and runs units unfiltered.
# https://www.freedesktop.org/software/systemd/man/latest/systemd.special.html#system.slice
[Slice]
SocketBindDeny=tcp:8545
