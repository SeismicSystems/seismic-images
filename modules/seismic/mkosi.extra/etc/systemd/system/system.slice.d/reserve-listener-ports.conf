# Each node service owns its listening ports, even while it is down, so no
# other process can impersonate it to the processes that trust those ports:
#   - the attestation service's root-key admission trusts 127.0.0.1:8545
#   - the network's front, outside the node, forwards public traffic to the
#     public ports on the node's IP
#
# Every unit runs in exactly one slice, and a unit can't lift its slice's deny.
# So each service that listens runs in its own slice (seismic-<name>.slice)
# with an allow-list of its own ports, while every other process, ours or the
# base image's, runs in system.slice, where this file denies it those ports.
# A new port goes here and into its unit's SocketBindAllow=.
#
# The production image starts no login path, so nothing runs in user.slice.
# Needs CONFIG_CGROUP_BPF=y: without it systemd logs and runs units unfiltered.
# https://www.freedesktop.org/software/systemd/man/latest/systemd.special.html#system.slice
[Slice]
# reth: RPC, WebSocket, Engine API over HTTP, metrics, devp2p
SocketBindDeny=tcp:8545
SocketBindDeny=tcp:8546
SocketBindDeny=tcp:8551
SocketBindDeny=tcp:9001
SocketBindDeny=30303
# summit: REST, admin RPC, metrics, P2P
SocketBindDeny=tcp:3030
SocketBindDeny=tcp:3031
SocketBindDeny=tcp:9002
SocketBindDeny=tcp:18551
# attestation: peer handshake, founding harvest
SocketBindDeny=tcp:7878
SocketBindDeny=tcp:7879
# tdx-init: the config POST
SocketBindDeny=tcp:8080
