# Every port a node service listens on belongs to that service alone,
# including while it is down. Other processes trust whatever answers there:
# the attestation service's root-key admission trusts 127.0.0.1:8545, Caddy
# forwards public traffic under the node's certificate to the loopback ports,
# and the operator POSTs the node's configuration to :8080.
#
# This file only takes these ports away from the processes in system.slice:
# every unit without a Slice= line, the base image's own included. No unit can
# lift its slice's deny, so each listener below runs in a slice of its own,
# seismic-<name>.slice under seismic.slice, which this file never reaches. Each
# one therefore repeats the reservation itself: SocketBindAllow= for its own
# ports and SocketBindDeny=any for the rest, other listeners' ports included
# (the attestation service denies all TCP but only udp:30303; see its unit). A new port goes here and into its
# unit's SocketBindAllow=. The production image starts no login path, so no
# process runs in user.slice.
# Needs CONFIG_CGROUP_BPF=y: without it systemd logs and runs units unfiltered.
# https://www.freedesktop.org/software/systemd/man/latest/systemd.special.html#system.slice
[Slice]
# reth: RPC, WebSocket, Engine API over HTTP, metrics, devp2p
SocketBindDeny=tcp:8545
SocketBindDeny=tcp:8546
SocketBindDeny=tcp:8551
SocketBindDeny=tcp:9001
SocketBindDeny=30303
# summit: REST, admin RPC, metrics, P2P
SocketBindDeny=tcp:3030
SocketBindDeny=tcp:3031
SocketBindDeny=tcp:9002
SocketBindDeny=tcp:18551
# attestation: peer handshake, founding harvest
SocketBindDeny=tcp:7878
SocketBindDeny=tcp:7879
# tdx-init: the config POST
SocketBindDeny=tcp:8080
# caddy: public HTTPS
SocketBindDeny=tcp:443
