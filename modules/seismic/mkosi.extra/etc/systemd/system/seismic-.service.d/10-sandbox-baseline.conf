# The sandbox every node service shares. systemd applies the drop-ins in
# seismic-.service.d/ to every unit whose name starts with seismic-, so a new
# node unit gets this sandbox without asking for it.
#
# systemd reads a unit's own file first and its drop-ins after. So for a
# single-value setting this file wins over the unit, and an empty assignment
# here would reset a list the unit set. It therefore holds only the settings no
# unit relaxes, plus lists a unit can add to. Each unit's own file keeps what
# differs:
#   - its slice and bind rules, or PrivateNetwork=
#   - any address family beyond AF_UNIX
#   - its writable paths
#   - its devices: PrivateDevices=, or DeviceAllow= lines
#   - its capabilities
[Service]
####### SANDBOX BASELINE #######

# Network
# socket() can create Unix sockets only. A unit adds AF_INET AF_INET6 for IP.
RestrictAddressFamilies=AF_UNIX

# Filesystem
# The whole filesystem read-only, except each unit's ReadWritePaths=.
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
# /proc lists only the processes of the unit's own user.
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectControlGroups=yes

# Privileges
# Running a setuid binary, or one with file capabilities, grants nothing.
NoNewPrivileges=yes
RestrictSUIDSGID=yes

# Syscalls and kernel
SystemCallFilter=@system-service
# Minus the privileged ones: setuid, chown, bpf, chroot and the like.
SystemCallFilter=~@privileged
# A refused syscall fails with EPERM rather than killing the process.
SystemCallErrorNumber=EPERM
# The native ABI only, so 32-bit syscalls can't slip past the filter.
SystemCallArchitectures=native
# No new namespaces, and with them none of the kernel code behind unprivileged
# user namespaces, a common path for privilege escalation.
RestrictNamespaces=yes
# No memory both writable and executable, so injected machine code can't run.
MemoryDenyWriteExecute=yes
# Its personality can't make readable memory executable, undoing the line above.
LockPersonality=yes
RestrictRealtime=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
# Implies DeviceAllow=char-rtc r, which turns device access into an allow-list:
# a unit that needs a device adds a DeviceAllow= line for it.
ProtectClock=yes
ProtectHostname=yes
####### END SANDBOX BASELINE #######
