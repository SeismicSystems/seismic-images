# enclave moves with both of the others:
# - seismic_reth: reth's CustodianClient and the custodian binary share the
#   custodian-ipc wire protocol.
# - summit: summit-key-holder writes the keystore summit reads back, so its
#   commonware pins must be summit's
#   (https://github.com/SeismicSystems/enclave/blob/seismic/bin/summit-key-holder/Cargo.toml).
#   A summit bump that moves commonware needs an enclave rev that moved too.
# TODO: we prob should add a CI check to ensure these pins stay in sync.
enclave:
  # One pin builds seismic-attestation-service, seismic-custodian-service,
  # tdx-init, and summit-key-holder. We could consider using separate pins for
  # each, but this is simpler for now, plus they will likely need to be updated
  # together in most cases since they share libraries.
  git_reference: 8b5833a43afe57157b182667aeed7994c317d09d
seismic_reth:
  git_reference: 39d04d158da383324b12c2e3397b0b28f3c3ee36
summit:
  git_reference: 5eb9f47f18644c2150a99ff119bf5f1a9fd0b258
