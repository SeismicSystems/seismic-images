# enclave moves with both of the others:
# - seismic_reth: reth's CustodianClient and the custodian binary share the
#   custodian-ipc wire protocol, and the attestation service's admission
#   freshness gate reads reth's finalized header timestamp as unix seconds.
# - summit: the attestation service's founding harvest serves the public-keys
#   file written from summit's `keys show --json`, so the two must agree on
#   its shape.
# summit and seismic_reth move together too: summit drives reth's Engine API
# through reth-seismic-engine-types, pinned in summit's Cargo.toml.
# The summit pin must also keep the `keys` CLI that
# seismic-summit-keygen.service and usr/bin/seismic-summit-persist call
# (`generate --no-overwrite`, `show --json`).
# TODO: we prob should add a CI check to ensure these pins stay in sync.
enclave:
  # One pin builds seismic-attestation-service, seismic-custodian-service,
  # and tdx-init. We could consider using separate pins for each, but this is
  # simpler for now, plus they will likely need to be updated together in most
  # cases since they share libraries.
  git_reference: a87993eb5bc9ad2157c8ea25b9b989f37ba93d1d
seismic_reth:
  git_reference: bc40907d43b9bdc4f3fa74dd98a54980b8659957
summit:
  git_reference: 69ca74de005f695c7f6f070655d481fb6473425a
caddy:
  # v2.11.7. Plain upstream: no plugins, so the build needs no xcaddy.
  git_reference: 72dd0fb067f6d7826c7f79907670ba4a713bfe37
