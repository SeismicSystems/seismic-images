[Output]
ImageId=seismic

[Build]
Environment=KERNEL_CONFIG_SNIPPETS_SEISMIC=modules/seismic/kernel/config.d
WithNetwork=true

[Content]
ExtraTrees=modules/seismic/mkosi.extra
PostInstallationScripts=modules/seismic/mkosi.postinst
BuildScripts=modules/seismic/mkosi.build

# cryptsetup, systemd-cryptsetup, tpm2-tools: persistent-luks-setup.service
#   uses cryptsetup + systemd-cryptenroll to provision the LUKS volume and
#   seal an unlock keyslot under a TPM2 PCR policy bound to the TDX
#   measurement; systemd-cryptsetup is the unlock helper called on every
#   subsequent boot. Flashbots builds cryptsetup from source with
#   --with-crypto_backend=kernel to minimize dependencies, but the Debian
#   package works fine for us since we already ship OpenSSL (for nginx/certbot).
# libtss2-*: TPM2 libraries the enclave links against for attestation.
Packages=cryptsetup
         systemd-cryptsetup
         tpm2-tools
         libtss2-esys-3.0.2-0t64
         libtss2-tctildr0t64
         # TODO(samlaf): replace nginx+certbot with RA-TLS (e.g. flashbots'
         # cvm-reverse-proxy) which embeds the TDX attestation quote in the
         # TLS cert, removing the need for Let's Encrypt and CAs entirely.
         nginx
         certbot
         python3-certbot-nginx
         lz4

BuildPackages=build-essential
              rustup
              git
              gcc
              curl
              zlib1g-dev
              libzstd-dev
              libleveldb-dev
              libsnappy-dev
              libpq-dev
              libssl-dev
              libtss2-dev
              pkg-config
              # yq is used by mkosi.build to read source pins from sources.yaml
              yq
