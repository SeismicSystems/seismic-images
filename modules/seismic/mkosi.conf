[Output]
ImageId=seismic

# TODO(samlaf): consider overriding shared/mkosi.conf's `Format=uki`
# here with `Format=disk` + a /usr/-verity partition layout, to
# gain runtime integrity protection on the OS surface. Might also
# instead belong in seismic.conf instead.
#
# Today the rootfs is the UKI's .initrd extracted into a writable
# tmpfs. PCR 11 covers it byte-for-byte at boot, but it's freely
# mutable at runtime — an attacker with in-guest root can overwrite
# /usr/bin/seismic-reth, drop /etc/systemd/system/foo.service +
# binary, swap a .so, etc., for the lifetime of the boot. Writes
# are ephemeral (gone on reboot) but the malicious daemon runs
# alongside the enclave until then.
#
# /usr/-verity splits the FS: /usr/ becomes a read-only dm-verity 
# partition, the roothash lands in the UKI's
# .cmdline → PCR 11 → the existing LUKS-policy work carries the
# trust chain. Closes the binary/library-overwrite pivot class.
# /etc/, /var/, /home/ stay writable on a separate partition;
# standard FHS layout starts to fit and /persistent/ probably
# folds into /var/.
#
# Prereqs before this is sane to land:
#   1. Signed-PCR-policy LUKS enrollment (the BLOCKER header in
#      setup-persistent-luks) must land first — else every release
#      rebases roothash → PCR 11 → bricks unlock on first update.
#   2. Audit and relocate /usr/ writes from runtime scripts. Main
#      offender is certbot's /etc/letsencrypt/; converges with
#      the nginx+certbot → RA-TLS TODO below.
#   3. Uniform `User=` across reth/summit/nginx (enclave already
#      done). Verity's value is in narrowing in-guest privilege
#      pivots; with services-as-root, an RCE in any of them is
#      RCE-into-root-readable enclave memory, and verity buys
#      little. With per-service UIDs, the standard pivots
#      (overwrite /usr/bin/X, swap a .so) are what verity closes.

[Build]
Environment=KERNEL_CONFIG_SNIPPETS_SEISMIC=modules/seismic/kernel/config.d
WithNetwork=true

[Content]
ExtraTrees=modules/seismic/mkosi.extra
PostInstallationScripts=modules/seismic/mkosi.postinst
BuildScripts=modules/seismic/mkosi.build

# cryptsetup, systemd-cryptsetup, tpm2-tools, jq: persistent-luks-setup.service
#   uses cryptsetup + systemd-cryptenroll to provision the LUKS volume and
#   seal an unlock keyslot under a TPM2 PCR policy bound to the TDX
#   measurement; systemd-cryptsetup is the unlock helper called on every
#   subsequent boot. Flashbots builds cryptsetup from source with
#   --with-crypto_backend=kernel to minimize dependencies, but the Debian
#   package works fine for us since we already ship OpenSSL (for nginx/certbot).
# libtss2-*: TPM2 libraries the enclave links against for attestation.
Packages=cryptsetup
         systemd-cryptsetup
         tpm2-tools
         jq
         libtss2-esys-3.0.2-0t64
         libtss2-tctildr0t64
         # TODO(samlaf): replace nginx+certbot with RA-TLS (e.g. flashbots'
         # cvm-reverse-proxy) which embeds the TDX attestation quote in the
         # TLS cert, removing the need for Let's Encrypt and CAs entirely.
         nginx
         certbot
         python3-certbot-nginx
         lz4

BuildPackages=build-essential
              rustup
              git
              gcc
              curl
              zlib1g-dev
              libzstd-dev
              libleveldb-dev
              libsnappy-dev
              libpq-dev
              libssl-dev
              libtss2-dev
              pkg-config
              # yq is used by mkosi.build to read source pins from sources.yaml
              yq
