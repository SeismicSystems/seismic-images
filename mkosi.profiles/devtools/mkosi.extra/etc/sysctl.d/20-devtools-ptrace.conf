# Lets strace and gdb attach on a dev image. The seismic module's
# 10-no-ptrace.conf sets Yama's ptrace_scope to 3, which can't be lowered until
# reboot, so this has to win before it is ever applied: systemd-sysctl applies
# only the last file, by name, that sets a key.
# 1: only an ancestor, or a process the target names with PR_SET_PTRACER.
# Root (CAP_SYS_PTRACE) can attach to anything.
kernel.yama.ptrace_scope = 1
