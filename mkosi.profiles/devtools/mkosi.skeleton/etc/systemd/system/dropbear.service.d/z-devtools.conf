[Unit]
# GCP dev mode: start dropbear immediately without waiting for wait-for-key
# Clear inherited dependencies from dropbear-prereq.conf
Requires=
After=
# Set minimal dependencies
After=network-setup.service
Requires=network-setup.service

[Service]
# Create debug SSH key before dropbear starts
ExecStartPre=/bin/sh -c 'mkdir -p /home/searcher/.ssh && echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINWLlaYUsgG7DJSynJNYKnucFnNe78VkU5s/5x6APTy7 azureuser@yocto-builder-2" > /home/searcher/.ssh/authorized_keys && chown -R searcher:searcher /home/searcher/.ssh && chmod 700 /home/searcher/.ssh && chmod 600 /home/searcher/.ssh/authorized_keys'
# Log to journal with identifier for easy filtering
StandardOutput=journal
StandardError=journal
SyslogIdentifier=dropbear
