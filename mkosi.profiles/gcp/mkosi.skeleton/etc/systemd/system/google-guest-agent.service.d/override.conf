[Unit]
# Remove dependencies on standard network services since we use custom networking
# Keep network-online.target dependency which is satisfied by network-setup.service
After=network-online.target syslog.service
Wants=network-online.target

# Clear the PartOf dependencies
PartOf=

[Install]
# Clear all previous WantedBy entries
WantedBy=
# Set new WantedBy
WantedBy=multi-user.target
