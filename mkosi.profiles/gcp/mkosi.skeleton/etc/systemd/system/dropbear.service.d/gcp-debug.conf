[Unit]
# Remove wait-for-key dependency for GCP debugging
After=network-setup.service searcher-firewall.service
Requires=searcher-firewall.service

[Service]
# Create a temporary debug key before dropbear starts
ExecStartPre=/bin/sh -c 'mkdir -p /home/searcher/.ssh && echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINWLlaYUsgG7DJSynJNYKnucFnNe78VkU5s/5x6APTy7 azureuser@yocto-builder-2" > /home/searcher/.ssh/authorized_keys && chown -R searcher:searcher /home/searcher/.ssh && chmod 700 /home/searcher/.ssh && chmod 600 /home/searcher/.ssh/authorized_keys'
