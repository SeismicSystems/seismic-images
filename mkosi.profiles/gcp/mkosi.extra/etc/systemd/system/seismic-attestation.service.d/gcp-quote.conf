# GCP has no vTPM: the service quotes through configfs-tsm, with /dev/tdx_guest
# as the fallback, and reads the CCEL and SMBIOS entries for its platform
# metadata. The baseline's read-only /sys and closed device policy cover both,
# so this drop-in opens exactly them.
[Unit]
After=sys-kernel-config.mount

[Service]
Environment=DCAP_TDX_QUOTE_CONFIGFS_PATH=/sys/kernel/config/tsm/report/seismic-attestation
# Hands the quote interfaces to the tpm group first, outside the sandbox ("+").
ExecStartPre=+/usr/bin/setup-gcp-quote-access
ReadWritePaths=-/sys/kernel/config/tsm/report
DeviceAllow=/dev/tdx_guest rw
