[Build]
Environment=KERNEL_CONFIG_SNIPPETS=seismic/kernel.config,mkosi.profiles/gcp/kernel.config

[Content]
ExtraTrees=mkosi.extra
KernelCommandLine=console=tty0 console=ttyS0,115200n8 mitigations=auto,nosmt spec_store_bypass_disable=on nospectre_v2 intel_iommu=on swiotlb=524288,force coherent_pool=256M iommu.strict=0 nvme_core.io_queue_depth=2

Packages=udev
         nvme-cli
         xxd
