[Unit]
# Override bob-common's dropbear-prereq.conf to remove wait-for-key dependency
# This allows SSH to start immediately without waiting for encryption keys
After=
Requires=
# Only wait for firewall
After=searcher-firewall.service
Requires=searcher-firewall.service

[Service]
# Clear ExecStartPre commands from bob-common
ExecStartPre=
# Only generate host key, don't wait for anything else
ExecStartPre=/bin/sh -c 'test -f /etc/dropbear/dropbear_ed25519_host_key || /usr/bin/dropbearkey -t ed25519 -f /etc/dropbear/dropbear_ed25519_host_key'
