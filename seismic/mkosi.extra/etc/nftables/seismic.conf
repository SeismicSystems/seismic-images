#!/usr/sbin/nft -f
# Seismic node firewall rules
# Default: drop all inbound, allow all outbound, allow established connections

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow established/related connections
        ct state established,related accept
        # Allow loopback
        iif lo accept

        # ICMP (ping)
        ip protocol icmp accept

        # SSH
        tcp dport 22 accept

        # HTTP/HTTPS (nginx + certbot)
        tcp dport { 80, 443 } accept

        # Seismic services
        tcp dport 7878 accept   # Enclave
        tcp dport 3030 accept   # Summit API

        # P2P networking
        tcp dport 30303 accept  # EL P2P (reth)
        udp dport 30303 accept
        tcp dport 9000 accept   # CL P2P
        udp dport 9000 accept
        tcp dport 18551 accept  # Summit P2P
        udp dport 18551 accept

        # Metrics (localhost only in production, open for now)
        tcp dport 9001 accept   # Reth Prometheus
        tcp dport 9090 accept   # Summit Prometheus

        # NTP
        udp dport 123 accept

        # Log and drop everything else
        log prefix "nft-drop: " limit rate 5/minute
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
