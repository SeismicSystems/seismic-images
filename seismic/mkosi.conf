[Output]
ImageId=seismic

[Build]
Environment=KERNEL_CONFIG_SNIPPETS_SEISMIC=seismic/kernel/config.d
WithNetwork=true

[Content]
ExtraTrees=seismic/mkosi.extra
PostInstallationScripts=seismic/mkosi.postinst
BuildScripts=seismic/mkosi.build

# Note: cryptsetup is needed by tdx-init for LUKS disk encryption.
# Flashbots builds it from source with --with-crypto_backend=kernel to minimize
# dependencies, but the Debian package works fine for us since we already ship
# OpenSSL (for nginx/certbot).
Packages=cryptsetup
         nftables
         # TODO(samlaf): replace nginx+certbot with RA-TLS (e.g. flashbots'
         # cvm-reverse-proxy) which embeds the TDX attestation quote in the
         # TLS cert, removing the need for Let's Encrypt and CAs entirely.
         nginx
         certbot
         python3-certbot-nginx
         libtss2-esys-3.0.2-0t64
         libtss2-tctildr0t64
         jq
         lz4

BuildPackages=build-essential
              rustc
              cargo
              git
              gcc
              curl
              zlib1g-dev
              libzstd-dev
              libleveldb-dev
              libsnappy-dev
              libpq-dev
              libssl-dev
              libtss2-dev
              pkg-config
              nodejs
              npm
              unzip
