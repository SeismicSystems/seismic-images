# Seismic-specific copy of build.yaml for now, kept separate so the upstream
# workflow can remain untouched.
#
# Every run builds the image, validates its contents, and measures its UKI.
# Pull requests and dispatches build it twice and require the two UKIs to be
# bit-identical. A push to `seismic` (or a dispatch on it) also publishes the
# image, under one name in two places — see README.md "Published images":
#
#   the VHD              → the `dev` container of the seismicimages storage
#                          account, as seismic_<version>.vhd (Azure's disk
#                          import reads only blob storage)
#   the measurements     → a GitHub prerelease tagged seismic_<version>, as
#                          measurements.azure-tdx.json + SHA256SUMS
#
# One-time setup for publishing. Three repo secrets — AZURE_CLIENT_ID (the
# service principal's application ID), AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# No Azure credential is stored: azure/login exchanges GitHub's OIDC token for
# an Azure one at run time, which the federated credential below permits; the
# release itself needs only the job's GITHUB_TOKEN. The principal may write
# blobs in the `dev` container and nothing else, and trusts one subject, this
# repo's `seismic` branch:
#
#   SUBSCRIPTION_ID=214887ea-51a7-4ca7-9cec-29b3cf3d311c
#   az account set --subscription "$SUBSCRIPTION_ID"
#   APP_ID=$(az ad app create --display-name seismic-images-publish --query appId -o tsv)
#   az ad sp create --id "$APP_ID"
#   SP_ID=$(az ad sp show --id "$APP_ID" --query id -o tsv)
#   az ad app federated-credential create --id "$APP_ID" --parameters '{
#     "name": "seismic-images-seismic",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:SeismicSystems/seismic-images:ref:refs/heads/seismic",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#   az role assignment create --assignee-object-id "$SP_ID" --assignee-principal-type ServicePrincipal \
#       --role "Storage Blob Data Contributor" \
#       --scope "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/seismic-images/providers/Microsoft.Storage/storageAccounts/seismicimages/blobServices/default/containers/dev"
#
# `az storage blob … --auth-mode login --account-name …` goes straight to the
# data plane, so the principal needs no management-plane role on the account.
name: Seismic image CI

on:
  push:
    branches:
      - seismic
  pull_request:
  workflow_dispatch:
    inputs:
      reprotest:
        description: Build twice and require bit-identical Seismic UKIs
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: validate Seismic module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell sources
        run: |
          bash -n \
            modules/seismic/mkosi.build \
            modules/seismic/mkosi.postinst \
            modules/seismic/mkosi.extra/usr/bin/setup-nginx-ssl \
            modules/seismic/mkosi.extra/usr/bin/setup-persistent-luks
          shellcheck -x \
            modules/seismic/mkosi.build \
            modules/seismic/mkosi.postinst \
            modules/seismic/mkosi.extra/usr/bin/setup-nginx-ssl \
            modules/seismic/mkosi.extra/usr/bin/setup-persistent-luks

      - name: Check source pins
        shell: python3 {0}
        run: |
          import pathlib
          import re

          source = pathlib.Path("modules/seismic/sources.yaml").read_text()
          pins = re.findall(r"^\s+git_reference:\s*([0-9a-f]+)\s*$", source, re.MULTILINE)
          if len(pins) != 3 or any(len(pin) != 40 for pin in pins):
              raise SystemExit("sources.yaml must contain three full 40-character git pins")

  build:
    name: build Seismic image
    needs: static
    runs-on: xl-github-runner-2
    steps:
      - uses: actions/checkout@v5

      # The runner pool mixes CPU types; host-sniffing build scripts (see
      # issue #46) can make image content depend on the machine. Record the
      # CPU (model + "Address sizes: .. bits virtual") so a reproducibility
      # failure can be correlated with hardware.
      - name: Show runner CPU
        run: lscpu

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio debian-archive-keyring zstd

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Seismic image
        run: |
          umask 022
          nix develop --command mkosi --force -I images/seismic.conf --image-id=seismic

      - name: Fix artifact permissions
        run: sudo chown -R "$(id -u):$(id -g)" build/

      - name: Validate artifacts and image contents
        run: |
          for suffix in efi initrd manifest vhd; do
            compgen -G "build/seismic_*.${suffix}" >/dev/null || {
              echo "Missing Seismic .${suffix} artifact" >&2
              exit 1
            }
          done

          initrd=$(compgen -G 'build/seismic_*.initrd' | head -n1)
          zstd -dc "$initrd" | cpio -it 2>/dev/null > build/seismic-initrd-files.txt
          while read -r expected; do
            grep -Fxq "$expected" build/seismic-initrd-files.txt || {
              echo "Missing expected image file: $expected" >&2
              exit 1
            }
          done <<'EOF'
          etc/systemd/system/attestation.service
          etc/systemd/system/custodian.service
          etc/systemd/system/persistent-luks-setup.service
          etc/systemd/system/reth.service
          etc/systemd/system/summit-key-holder.service
          etc/systemd/system/summit.service
          etc/systemd/system/tdx-init.service
          etc/systemd/system/minimal.target.wants/attestation.service
          etc/systemd/system/minimal.target.wants/custodian.service
          etc/systemd/system/minimal.target.wants/persistent-luks-setup.service
          etc/systemd/system/minimal.target.wants/reth.service
          etc/systemd/system/minimal.target.wants/summit-key-holder.service
          etc/systemd/system/minimal.target.wants/summit.service
          etc/systemd/system/minimal.target.wants/tdx-init.service
          usr/bin/seismic-attestation-service
          usr/bin/seismic-custodian-service
          usr/bin/seismic-reth
          usr/bin/setup-nginx-ssl
          usr/bin/setup-persistent-luks
          usr/bin/summit
          usr/bin/summit-key-holder
          usr/bin/tdx-init
          EOF

      # The measured-boot prediction for this UKI, stamped with the VHD name
      # it binds to (`make measure`; the Makefile owns the stamping). The
      # wrapper would otherwise reach for Lima; `.bypass-lima` (gitignored, so
      # mkosi.version still sees a clean tree) tells it to run in nix here.
      # Deterministic given the UKI, so a reprotest-clean build measures the
      # same on any runner. The stamp must name the VHD this build produced:
      # that equality is what lets a consumer resolve the file to its blob
      # and its release from the name alone.
      - name: Measure the UKI
        run: |
          touch .bypass-lima
          make measure FILE="$(compgen -G 'build/seismic_*.efi')"
          stamped=$(jq -r .measurement_id build/measurements.azure-tdx.json)
          vhd=$(basename "$(compgen -G 'build/seismic_*.vhd')")
          [ "$stamped" = "$vhd" ] || {
            echo "measurement_id $stamped does not name the built VHD $vhd" >&2
            exit 1
          }

      - name: Show build artifacts
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Image: seismic"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          find build -maxdepth 1 -type f -name 'seismic*' \
            -printf '%f (%k KiB)\n'

      - name: Generate EFI checksum
        run: sha256sum build/seismic_*.efi | tee build/checksum.sha256

      # What the release ships beside the measurements. The UKI alone: it is
      # the whole image identity (the VHD only wraps it on a FAT partition,
      # and that wrapping is not reproducible, so its hash would be a record
      # no rebuilder could confirm). Bare filename, so `sha256sum -c
      # SHA256SUMS` works from wherever the file was downloaded to.
      - name: Generate release checksums
        run: (cd build && sha256sum seismic_*.efi) | tee build/SHA256SUMS

      # Per-file hashes let reprotest-compare name the exact divergent files
      # on a mismatch, instead of only reporting that the whole UKI differs.
      - name: Hash initrd contents
        run: |
          initrd=$(compgen -G 'build/seismic_*.initrd' | head -n1)
          mkdir "$RUNNER_TEMP/initrd-root"
          zstd -dc "$initrd" | cpio -idm --quiet --no-absolute-filenames \
            --no-preserve-owner -D "$RUNNER_TEMP/initrd-root"
          (cd "$RUNNER_TEMP/initrd-root" \
            && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            > build/initrd-files.sha256

      - name: Upload checksums for reproducibility comparison
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.reprotest)
        uses: actions/upload-artifact@v4
        with:
          name: checksum-seismic-build-1
          path: |
            build/checksum.sha256
            build/initrd-files.sha256
          retention-days: 1

      # Hand-off to the publish job, which runs with the write permissions
      # this job does not have. A day is plenty: the release and the blob are
      # the durable copies.
      - name: Upload the image for publishing
        if: >-
          github.ref == 'refs/heads/seismic' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: image-seismic
          path: |
            build/seismic_*.vhd
            build/measurements.azure-tdx.json
            build/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  # Publishing is its own job so that only it holds `contents: write` and the
  # OIDC token, and the build — which runs the image's build scripts — keeps
  # the workflow's read-only default. Both halves are idempotent: a blob is
  # never overwritten, and an existing release has its assets replaced, so a
  # run that died halfway is re-run, not repaired by hand.
  publish:
    name: publish Seismic image
    if: >-
      github.ref == 'refs/heads/seismic' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_STORAGE_ACCOUNT: seismicimages
      AZURE_CONTAINER: dev
    steps:
      # For the Makefile: `make push-azure` is the one definition of the
      # upload and the blob URL, for CI and for a human alike.
      - uses: actions/checkout@v5

      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: image-seismic
          path: build

      # The image's name is the one the build stamped into the measurements;
      # the release tag, the blob and the title all derive from it.
      - name: Name the image
        id: image
        run: |
          stamped=$(jq -r .measurement_id build/measurements.azure-tdx.json)
          image=${stamped%.vhd}
          [ -f "build/$image.vhd" ] || {
            echo "the measurements name $stamped, which is not among the built artifacts" >&2
            exit 1
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mirror the VHD to blob storage
        run: >-
          make push-azure
          AZURE_STORAGE_ACCOUNT="$AZURE_STORAGE_ACCOUNT"
          AZURE_CONTAINER="$AZURE_CONTAINER"
          VHD="build/${{ steps.image.outputs.image }}.vhd"

      # The release notes: the one place the blob URL and the measurements
      # URL are written down together, for a human reading the release.
      - name: Write the release notes
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          vhd_blob_url="https://$AZURE_STORAGE_ACCOUNT.blob.core.windows.net/$AZURE_CONTAINER/$IMAGE.vhd"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Seismic node image \`$IMAGE\`, built by this repository at $GITHUB_SHA.

          | | |
          |---|---|
          | \`vhd_blob_url\` | \`$vhd_blob_url\` |
          | measurements | [\`measurements.azure-tdx.json\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$IMAGE/measurements.azure-tdx.json) |
          | checksums | \`SHA256SUMS\` over the \`.efi\` (the UKI the VHD wraps) |

          Boot nodes from the \`vhd_blob_url\` above; the measurements are what a verifier expects those nodes to attest.
          EOF

      # A prerelease: CI builds of the branch are what the `dev` container
      # holds, not an operator release. The tag is created at the commit that
      # built the image. The action updates a release that already exists for
      # the tag and replaces same-named assets, which is what makes a re-run
      # complete a release an earlier run left half-made. Pinned to the
      # commit behind v2.2.2 — the version seismic-reth and seismic-foundry
      # release with — rather than the tag: this step holds `contents: write`.
      - name: Publish the release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.image.outputs.image }}
          name: ${{ steps.image.outputs.image }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          files: |
            build/measurements.azure-tdx.json
            build/SHA256SUMS

  reprotest-build:
    name: reproducibility build
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.reprotest)
    needs: static
    runs-on: xl-github-runner-2
    steps:
      - uses: actions/checkout@v5

      # See the note on the build job's identical step.
      - name: Show runner CPU
        run: lscpu

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio debian-archive-keyring zstd

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Seismic image again
        run: |
          umask 022
          nix develop --command mkosi --force -I images/seismic.conf --image-id=seismic
          sudo chown -R "$(id -u):$(id -g)" build/

      - name: Generate EFI checksum
        run: sha256sum build/seismic_*.efi | tee build/checksum.sha256

      # See the note on the build job's identical step.
      - name: Hash initrd contents
        run: |
          initrd=$(compgen -G 'build/seismic_*.initrd' | head -n1)
          mkdir "$RUNNER_TEMP/initrd-root"
          zstd -dc "$initrd" | cpio -idm --quiet --no-absolute-filenames \
            --no-preserve-owner -D "$RUNNER_TEMP/initrd-root"
          (cd "$RUNNER_TEMP/initrd-root" \
            && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            > build/initrd-files.sha256

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksum-seismic-build-2
          path: |
            build/checksum.sha256
            build/initrd-files.sha256
          retention-days: 1

  reprotest-compare:
    name: compare reproducibility builds
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.reprotest)
    needs:
      - build
      - reprotest-build
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          pattern: checksum-seismic-build-*
          path: checksums/

      - name: Compare EFI hashes
        run: |
          hash1=$(awk '{print $1}' checksums/checksum-seismic-build-1/checksum.sha256)
          hash2=$(awk '{print $1}' checksums/checksum-seismic-build-2/checksum.sha256)

          echo "EFI hash build 1: $hash1"
          echo "EFI hash build 2: $hash2"

          if [ "$hash1" != "$hash2" ]; then
            echo "Seismic UKIs are not reproducible" >&2
            echo "Divergent initrd files (< build 1, > build 2):"
            if diff checksums/checksum-seismic-build-1/initrd-files.sha256 \
                    checksums/checksum-seismic-build-2/initrd-files.sha256; then
              echo "initrd contents are identical: the divergence is in the" \
                   "kernel, cmdline, or UKI wrapping"
            fi
            exit 1
          fi
          echo "Seismic UKIs are bit-for-bit reproducible"
